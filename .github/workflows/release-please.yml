name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release-tag
        env:
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$CREATED_TAG"
          if [ -z "$tag" ]; then
            while IFS= read -r candidate; do
              if [ "$(git rev-list -n 1 "$candidate")" = "$GITHUB_SHA" ]; then
                tag="$candidate"
                break
              fi
            done < <(gh release list --limit 20 --json tagName --jq '.[].tagName')
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and upload release assets
        if: steps.release-tag.outputs.tag != ''
        env:
          RUST_VERSION: 1.97.1
          WASM_TARGET: wasm32-wasip1
          WASM_BINARY: zellij-tab-namer
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$WASM_TARGET"
          rustup default "$RUST_VERSION"
          cargo build --locked --release --target "$WASM_TARGET" --bin "$WASM_BINARY"
          mkdir dist
          install -m 0644 "target/$WASM_TARGET/release/$WASM_BINARY.wasm" "dist/$WASM_BINARY.wasm"
          cd dist
          sha256sum "$WASM_BINARY.wasm" > "$WASM_BINARY.wasm.sha256"
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing_assets" | grep -Fx "$WASM_BINARY.wasm" >/dev/null &&
             printf '%s\n' "$existing_assets" | grep -Fx "$WASM_BINARY.wasm.sha256" >/dev/null; then
            echo "Release $RELEASE_TAG already has both WASM assets"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" \
            "$WASM_BINARY.wasm" \
            "$WASM_BINARY.wasm.sha256" \
            --clobber
