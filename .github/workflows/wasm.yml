name: WASM

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.1
  WASM_TARGET: wasm32-wasip1
  WASM_BINARY: zellij-tab-namer

jobs:
  build:
    name: Build WASM artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --target "$WASM_TARGET"

      - name: Select Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --lib

      - name: Build release artifact
        run: cargo build --locked --release --target "$WASM_TARGET" --bin "$WASM_BINARY"

      - name: Package artifact
        run: |
          mkdir -p dist
          install -m 0644 \
            "target/$WASM_TARGET/release/$WASM_BINARY.wasm" \
            "dist/$WASM_BINARY.wasm"
          cd dist
          sha256sum "$WASM_BINARY.wasm" > "$WASM_BINARY.wasm.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zellij-tab-namer-wasm
          path: |
            dist/zellij-tab-namer.wasm
            dist/zellij-tab-namer.wasm.sha256
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches package version
        run: |
          package_version="$(
            cargo metadata --locked --format-version 1 --no-deps |
              python3 -c 'import json, sys; name = sys.argv[1]; versions = [p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == name]; assert len(versions) == 1; print(versions[0])' "$WASM_BINARY"
          )"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo package version $package_version" >&2
            exit 1
          fi

      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zellij-tab-namer-wasm
          path: dist

      - name: Verify downloaded artifact
        run: cd dist && sha256sum -c zellij-tab-namer.wasm.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          )"

          case "$release_status" in
            404) ;;
            200)
              echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets" >&2
              exit 1
              ;;
            *)
              echo "GitHub release lookup failed with HTTP $release_status" >&2
              exit 1
              ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            dist/zellij-tab-namer.wasm \
            dist/zellij-tab-namer.wasm.sha256 \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
