[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zellij-tab-namer"
version = "0.2.0"
description = "Name Zellij tabs from pane titles and lightweight local context."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zellij-tab-namer = "zellij_tab_namer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
